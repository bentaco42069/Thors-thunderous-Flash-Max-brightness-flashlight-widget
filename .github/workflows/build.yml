name: Build Thor's Thunderous Flash APK

# Builds the app into an installable .apk in the cloud and attaches it to a
# GitHub Release, so it can be downloaded straight to a phone.

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Don't let the action auto-install the legacy "tools" package: Google
          # removed it from the SDK, so that default install now fails the whole
          # build. We install exactly what we need in the next step instead.
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Build the debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk thors-thunderous-flash.apk

      - name: Upload the APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: thors-thunderous-flash-apk
          path: thors-thunderous-flash.apk

      - name: Publish the APK to a Release (easy phone download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete flashlight --yes --cleanup-tag || true
          gh release create flashlight thors-thunderous-flash.apk \
            --title "Thor's Thunderous Flash" \
            --notes "Tap **thors-thunderous-flash.apk** below to install. A home-screen Mjolnir widget that fires your flashlight at maximum brightness. Android 8+."
